server:
  port: 8081

spring:
  application:
    name: user-service
  
  datasource:
    url: ${USER_DB_URL}
    username: ${VOTING_DB_USER}
    password: ${VOTING_DB_PASSWORD}
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.PostgreSQLDialect

eureka:
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka/
    enabled: false # Set to true once Eureka Server is running

management:
  endpoints:
    web:
      exposure:
        include: health, prometheus, info
