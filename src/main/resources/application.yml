server:
  port: 8081

spring:
  application:
    name: user-service

  datasource:
    url: ${VOTING_DB_URL}/userservice_db
    username: ${VOTING_DB_USER}
    password: ${VOTING_DB_PASSWORD}
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.PostgreSQLDialect

eureka:
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka/
    enabled: true

management:
  endpoints:
    web:
      exposure:
        include: health, prometheus, info

# ─── JWT Configuration ───────────────────────────────────────────────
# SECRET: Must be a Base64-encoded string, minimum 256 bits for HS256.
#   Generate one:  openssl rand -base64 32
# EXPIRATION: Token lifetime in milliseconds (default: 24 hours)
# ─────────────────────────────────────────────────────────────────────
jwt:
  secret: ${JWT_SECRET}
  expiration: ${JWT_EXPIRATION}
